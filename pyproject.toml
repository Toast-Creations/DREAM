[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dream-research"
version = "2.0.0"
description = "Controlled exploratory inference and reversible learning research"
requires-python = ">=3.11"
authors = [{name = "David Cook"}, {name = "Toast Creations LLC"}]
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
ml = ["torch>=2.6,<3", "transformers>=4.55.4,<5", "peft>=0.17,<0.18", "safetensors>=0.6.2", "accelerate>=1.10,<2"]

[tool.setuptools.packages.find]
where = ["src"]
